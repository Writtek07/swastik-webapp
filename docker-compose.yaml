x-common-labels: &default-labels
  env: production
  app: swastik

services:
  swastik-db:
    image: postgres:14.2-alpine
    container_name: swastik-postgres-14.2
    volumes:
      - swastik_pgdata:/var/lib/postgresql/data  # Mounted database to ec2 volumne
    command: 
      "postgres -c 'max_connections=500'"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}    
    labels:
      <<: *default-labels
      service: postgres_db

  swastik-web:
    build: .
    command: "./bin/rails server"
    container_name: swastik-web
    volumes:
      - swastik_rails_mount:/rails/storage  # Mounted to ec2 volumne as isolated volume
    depends_on:
      - swastik-db
    ports:
      - "3000:3000"
    env_file:
      - .env
    labels:
      <<: *default-labels
      service: web

volumes:
  swastik_pgdata: {}
  swastik_rails_mount: {}
